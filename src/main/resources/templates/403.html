<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>访问被拒绝 - 图书管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 100px;
        }
        .error-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .error-icon {
            font-size: 80px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-title {
            color: #dc3545;
            margin-bottom: 20px;
        }
        .user-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-ban"></i>
        </div>
        <h1 class="error-title">访问被拒绝</h1>

        <div class="alert alert-danger">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${message}">抱歉，您没有权限访问此页面。</span>
        </div>

        <div class="user-info">
            <p><strong>当前用户：</strong> <span th:text="${#authentication.name}">未知</span></p>
            <p><strong>用户角色：</strong>
                <span th:each="authority : ${#authentication.authorities}"
                      th:text="${authority.authority} + ' '">
                        未知角色
                    </span>
            </p>
        </div>

        <div class="mt-4">
            <p th:text="${advice}">请联系系统管理员获取相应权限。</p>
        </div>

        <div class="mt-4">
            <a href="/library/books" class="btn btn-primary me-2">
                <i class="fas fa-book"></i> 返回图书管理
            </a>
            <a href="/library/" class="btn btn-outline-secondary">
                <i class="fas fa-home"></i> 返回首页
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger ms-2">
                    <i class="fas fa-sign-out-alt"></i> 切换账号
                </button>
            </form>
        </div>

        <div class="mt-4 text-muted">
            <small>如需提升权限，请联系系统管理员。</small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
