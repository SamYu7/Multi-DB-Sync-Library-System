<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>数据源测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>多数据源连接测试</h2>

    <div class="mb-3">
        <button class="btn btn-primary" onclick="testDataSource()">
            测试三个数据库连接
        </button>
    </div>

    <div id="result" class="mt-3"></div>
</div>

<script>
    function testDataSource() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>';

        fetch('/library/test-conflict/datasource-info-simple')
            .then(response => response.json())
            .then(data => {
                let html = '';

                if (data.success) {
                    html += `<div class="alert alert-${data.allCorrect ? 'success' : 'warning'}">
                        <strong>${data.message}</strong>
                    </div>`;

                    html += '<table class="table"><thead><tr><th>数据源</th><th>状态</th><th>实际数据库</th><th>URL</th></tr></thead><tbody>';

                    data.dataSources.forEach(ds => {
                        const statusClass = ds.statusColor || 'secondary';

                        html += `<tr>
                            <td><strong>${ds.name}</strong></td>
                            <td><span class="badge bg-${statusClass}">${ds.status}</span></td>
                            <td>${ds.actualProduct || '-'}</td>
                            <td><small>${ds.url || '-'}</small></td>
                        </tr>`;
                    });

                    html += '</tbody></table>';
                } else {
                    html = `<div class="alert alert-danger">${data.error}</div>`;
                }

                resultDiv.innerHTML = html;
            })
            .catch(error => {
                resultDiv.innerHTML = `<div class="alert alert-danger">请求失败: ${error.message}</div>`;
            });
    }
</script>
</body>
</html>
