<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>数据源验证</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .database-card {
            margin-bottom: 20px;
            border-left: 5px solid;
        }
        .mysql-card { border-left-color: #00758f; }
        .postgresql-card { border-left-color: #336791; }
        .sqlserver-card { border-left-color: #d14233; }
        .success { color: #198754; }
        .error { color: #dc3545; }
        .warning { color: #ffc107; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2>🧪 数据源配置验证</h2>
    <p class="text-muted">验证三个数据库是否真正独立配置</p>

    <div class="mb-3">
        <button class="btn btn-primary" onclick="verifyDataSources()">验证数据源配置</button>
        <button class="btn btn-secondary" onclick="createTestData()">创建测试数据</button>
    </div>

    <div id="result" class="mb-4"></div>

    <div class="row">
        <div class="col-md-4">
            <div class="card database-card mysql-card">
                <div class="card-header">
                    <strong>🐬 MySQL</strong>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        <small>端口: 3306</small><br>
                        <small>库名: library_system</small>
                    </p>
                    <div id="mysqlStatus" class="badge bg-secondary">未测试</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card database-card postgresql-card">
                <div class="card-header">
                    <strong>🐘 PostgreSQL</strong>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        <small>端口: 5432</small><br>
                        <small>库名: library_system</small>
                    </p>
                    <div id="postgresqlStatus" class="badge bg-secondary">未测试</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card database-card sqlserver-card">
                <div class="card-header">
                    <strong>🏢 SQL Server</strong>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        <small>端口: 1433</small><br>
                        <small>库名: library_system</small>
                    </p>
                    <div id="sqlserverStatus" class="badge bg-secondary">未测试</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function verifyDataSources() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>';

        try {
            const response = await fetch('/library/verify/datasources');
            const data = await response.json();

            let html = '';

            if (data.connections) {
                // 更新状态卡片
                updateStatus('mysql', data.connections.mysql);
                updateStatus('postgresql', data.connections.postgresql);
                updateStatus('sqlserver', data.connections.sqlserver);

                html += `<div class="alert alert-${data.allDifferent ? 'success' : 'warning'}">
                    <h5>${data.message}</h5>
                </div>`;

                html += '<h5>详细连接信息：</h5>';
                html += '<table class="table table-sm"><thead><tr><th>数据库</th><th>产品</th><th>URL</th><th>驱动</th></tr></thead><tbody>';

                for (const [db, info] of Object.entries(data.connections)) {
                    if (info.error) {
                        html += `<tr class="table-danger">
                            <td><strong>${db}</strong></td>
                            <td colspan="3">❌ ${info.error}</td>
                        </tr>`;
                    } else {
                        html += `<tr>
                            <td><strong>${db}</strong></td>
                            <td>${info.databaseProductName}</td>
                            <td><small>${info.url}</small></td>
                            <td>${info.driverName}</td>
                        </tr>`;
                    }
                }

                html += '</tbody></table>';
            }

            resultDiv.innerHTML = html;
        } catch (error) {
            resultDiv.innerHTML = `<div class="alert alert-danger">请求失败: ${error.message}</div>`;
        }
    }

    function updateStatus(dbName, info) {
        const element = document.getElementById(dbName + 'Status');
        if (!element) return;

        if (info.error) {
            element.textContent = '❌ 连接失败';
            element.className = 'badge bg-danger';
        } else {
            element.textContent = '✅ 连接成功';
            element.className = 'badge bg-success';
        }
    }

    async function createTestData() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>';

        try {
            const response = await fetch('/library/verify/create-test-data');
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<div class="alert alert-danger">请求失败: ${error.message}</div>`;
        }
    }
</script>
</body>
</html>
